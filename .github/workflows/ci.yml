# Test on every push/PR; release on push to master via zx-semrel + npm OIDC.
# npm trusted publisher must be configured at https://www.npmjs.com/package/@antongolub/artel
# pointing to this repository's .github/workflows/ci.yml.
name: CI

on: [push, pull_request]

env:
  npm_config_audit: false
  npm_config_fund: false

# Default to no permissions; jobs opt in to what they need.
permissions: {}

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: 'npm' }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  release:
    name: Release ${{ github.ref }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # release commit + tag
      packages: write    # zx-semrel also publishes to npm.pkg.github.com
      id-token: write    # npm trusted publishing (OIDC) — implies provenance
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: 'npm' }
      - run: npm ci
      - name: Run release
        env:
          NPM_OIDC: true
          GH_USER: x-access-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx zx-semrel
